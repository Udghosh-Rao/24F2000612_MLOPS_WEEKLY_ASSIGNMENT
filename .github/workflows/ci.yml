name: IRIS Pipeline CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mlflow dvc-gs

      - name: Authenticate to GCP
        run: |
          echo "$GCP_SA_KEY" > gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json" >> "$GITHUB_ENV"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: DVC pull (data only)
        run: dvc pull

      - name: Run tests
        run: pytest tests/ -v --tb=short | tee pytest_report.txt

      - name: Clean up GCP key
        if: always()
        run: rm -f gcp-key.json

      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2

      - name: Create CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Test Report" > report.md
          echo "" >> report.md
          echo '```' >> report.md
          cat pytest_report.txt >> report.md
          echo '```' >> report.md
          cml comment create report.md
