name: IRIS Pipeline CI

# Task 4: run on every push AND every pull request, on every branch
# (no "branches: [main]" filter, so week_4, main, etc. all trigger this)
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # needed so CML can comment on the PR

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Task 3: checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Task 3: authenticate to GCS using the service account key
      # stored as a GitHub secret (see README / setup steps for how to add it)
      - name: Authenticate to GCP
        run: |
          echo "$GCP_SA_KEY" > gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json" >> "$GITHUB_ENV"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      # Task 3: pull the versioned data + model from the GCS remote
      - name: DVC pull
        run: dvc pull

      # Task 1 + Task 2: run all pytest tests (data validation + model evaluation)
      - name: Run tests
        run: pytest tests/ -v --tb=short | tee pytest_report.txt

      - name: Clean up GCP key
        if: always()
        run: rm -f gcp-key.json

      # Task 5: publish results as a comment on the pull request via CML
      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2

      - name: Create CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Test Report" > report.md
          echo "" >> report.md
          echo '```' >> report.md
          cat pytest_report.txt >> report.md
          echo '```' >> report.md
          cml comment create report.md
