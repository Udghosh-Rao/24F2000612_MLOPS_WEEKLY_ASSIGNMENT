name: IRIS Pipeline CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy==1.26.4 scikit-learn==1.3.2 joblib pytest mlflow

      - name: Create clean IRIS dataset
        run: |
          python - <<'PY'
          from sklearn.datasets import load_iris
          import pandas as pd
          import os

          iris = load_iris()

          df = pd.DataFrame(
              iris.data,
              columns=[
                  "sepal_length",
                  "sepal_width",
                  "petal_length",
                  "petal_width"
              ]
          )

          df["species"] = [
              iris.target_names[i]
              for i in iris.target
          ]

          os.makedirs("data", exist_ok=True)
          df.to_csv("data/iris.csv", index=False)

          print("Created IRIS dataset:", df.shape)
          PY

      - name: Validate IRIS dataset
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("data/iris.csv")

          expected = [
              "sepal_length",
              "sepal_width",
              "petal_length",
              "petal_width",
              "species"
          ]

          assert list(df.columns) == expected
          assert len(df) == 150
          assert df.isnull().sum().sum() == 0
          assert df["species"].nunique() == 3

          print("Dataset validation passed")
          print(df["species"].value_counts())
          PY

      - name: Run Week 8 MLSecOps experiment
        run: |
          python mlsecops_iris.py

      - name: Validate poisoning results
        run: |
          python - <<'PY'
          import pandas as pd

          results = pd.read_csv(
              "data/mlsecops/mlsecops_results.csv"
          )

          expected = ["0%", "5%", "10%", "50%"]

          assert results["poisoning"].tolist() == expected
          assert len(results) == 4

          for metric in [
              "accuracy",
              "precision",
              "recall",
              "f1_score"
          ]:
              assert metric in results.columns
              assert results[metric].between(0, 1).all()

          assert results.loc[
              results["poisoning"] == "0%",
              "accuracy"
          ].iloc[0] >= 0.85

          print("Week 8 MLSecOps validation passed")
          print(results.to_string(index=False))
          PY

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: mlsecops-results
          path: |
            data/mlsecops/mlsecops_results.csv
            data/mlsecops/*.csv
            data/mlsecops/*.joblib
