name: CD - Build, Push, Deploy, Stress Test

on:
  push:
    branches: [week_7]

env:
  REGION: us-central1
  REPO_NAME: iris-repo
  IMAGE_NAME: iris-api
  CLUSTER_NAME: iris-cluster
  CLUSTER_REGION: us-central1

permissions:
  contents: read
  id-token: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_REGION }}

      - name: Deploy to GKE
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/iris-api --timeout=180s

      - name: Get service external IP
        run: |
          kubectl get service iris-api-service
          for i in {1..30}; do
            IP=$(kubectl get service iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ]; then break; fi
            sleep 5
          done
          echo "EXTERNAL_IP=$IP" >> $GITHUB_ENV
          echo "Service IP: $IP"

      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      - name: Run stress test with wrk
        run: |
          echo "Running wrk load test against http://${EXTERNAL_IP}/predict"
          wrk -t4 -c1000 -d30s -s /dev/stdin http://${EXTERNAL_IP}/predict << 'LUA'
          wrk.method = "POST"
          wrk.body = '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}'
          wrk.headers["Content-Type"] = "application/json"
          LUA

      - name: Show HPA and pod status after load
        run: |
          kubectl get hpa
          kubectl get pods
